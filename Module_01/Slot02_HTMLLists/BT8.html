<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Đăng Ký Đặt Vé Sự Kiện Âm Nhạc</h1>
    <form action="\">
      Họ và tên:
      <input
        type="text"
        placeholder="Nhập họ và tên..."
        required
        minlength="3"
        maxlength="50"
      />

      <br />
      <br />

      Số lượng vé:
      <input type="number" min="1" max="5" />

      <br />
      <br />

      Mã vé VIP (Đã cấp sẵn):
      <input type="text" readonly value="MUSIC-VIP-2026" />

      <br />
      <br />

      Mã giảm giá nội bộ:
      <input type="text" disabled value="NOT-ELIGIBLE" />

      <br />
      <br />

      <button type="submit">Xác nhận đặt vé</button>
    </form>
  </body>
</html>
