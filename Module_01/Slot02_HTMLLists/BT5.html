<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Khảo sát dịch vụ khách hàng</h1>
    <form action="https://www.google.com/">
      Độ tuổi của bạn:
      <input type="number" />
      <br />
      <br />

      <fieldset>
        <legend>Giới tính của bạn là gì?</legend>
        <input type="radio" name="gender" /> Nam
        <input type="radio" name="gender" /> Nữ
        <input type="radio" name="gender" /> Khác
      </fieldset>

      <br />

      <fieldset>
        <legend>Dịch vụ bạn đang quan tâm (có thể chọn nhiều):</legend>
        <input type="checkbox" /> Website <input type="checkbox" /> Mobile App
        <input type="checkbox" /> Marketing
      </fieldset>

      <br />
      Quốc gia đang sinh sống:
      <select name="country" id="country">
        <option>-- Vui lòng chọn --</option>
        <option value="Vietnam">Việt Nam</option>
        <option value="Japan">Nhật Bản</option>
        <option value="America">Hoa Kỳ</option>
      </select>

      <br />
      <br />

      <button type="submit">Gửi thông tin</button>
    </form>
  </body>
</html>
