<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      * {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="max-w-[1200px] mx-auto mt-5 bg-gray-50 p-3">
      <form
        action=""
        class="flex flex-col md:flex-row gap-6 w-full justify-center border-2 bg-white border-solid border-gray-200 rounded-md shadow-sm p-7"
      >
        <div class="flex flex-col flex-1">
          <label for="destination" class="font-bold">Điểm đến</label>
          <input
            type="text"
            placeholder="Bạn muốn đi đâu"
            id="destination"
            class="border-1 border-solid border-gray-200 rounded-md shadow-sm p-2 w-full"
          />
        </div>

        <div class="flex flex-col flex-1">
          <label for="start-date" class="font-bold">Ngày đi</label>
          <input
            type="date"
            id="start-date"
            class="border-2 border-solid border-gray-200 rounded-md shadow-sm p-2 w-full"
          />
        </div>

        <div class="flex flex-col justify-end">
          <button
            class="text-white bg-blue-600 py-2 rounded-md font-bold px-6 md:w-auto"
          >
            Tìm kiếm
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
