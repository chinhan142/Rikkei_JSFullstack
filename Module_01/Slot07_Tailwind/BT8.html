<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-100 dark:bg-[#111727]">
    <div class="bg-gray-100 p-1 dark:bg-[#111727]">
      <div
        class="w-[320px] my-32 mx-auto border-2 border-solid border-gray-100 shadow-md rounded-md p-4 bg-white leading-10 dark:bg-[#1E2938] dark:border-[#2C3543]"
      >
        <div class="text-center">
          <h3 class="font-bold text-xl mt-3 dark:text-white">Tour Đà Lạt</h3>
          <p class="text-gray-500 font-semibold">3 Ngày 2 Đêm</p>
        </div>

        <div class="ml-6">
          <div class="my-2">
            <span
              class="text-blue-600 font-extrabold text-3xl dark:text-[#63A1F8]"
              >2.500.000đ</span
            >
            <span class="text-gray-400 font-bold">/khách</span>
          </div>

          <div class="text-gray-500 font-bold dark:text-[#C7D3EC]">
            <p>Khách sạn 4 sao trung tâm</p>
            <p>Xe Limousine đưa đón tận nơi</p>
            <p>Vé tham quan tất cả các điểm</p>
          </div>
        </div>

        <div>
          <button
            class="text-white font-bold bg-blue-600 rounded-md w-full mt-4 dark:bg-[#3C82F5]"
          >
            ĐẶT TOUR NGAY
          </button>
        </div>
      </div>

      <button
        class="fixed top-5 right-5 justify-end mb-3 px-3 py-1 rounded-md bg-gray-100 shadow-md text-black font-bold dark:bg-gray-500 dark:text-white"
      >
        Đổi Giao Diện
      </button>
    </div>
  </body>
</html>
