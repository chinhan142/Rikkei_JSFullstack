<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div>
      <h2 class="text-center text-3xl font-bold mt-4 mb-4">Các Tour Nổi Bật</h2>
      <div class="flex justify-center items-center gap-6">
        <div
          class="flex flex-col items-center border-2 border-solid border-white rounded-lg shadow-md overflow-hidden w-64"
        >
          <img
            src="https://cdn.saigontimestravel.com/storage/images/retail/wp-content/uploads/2024/10/Thai-Lan-co-bao-nhieu-tinh-1.jpg"
            alt=""
            class="w-full h-48 object-cover rounded-lg"
          />
          <div class="text-center mt-2 mb-2">
            <h3 class="font-bold">Thái Lan</h3>
            <p>Xử sở chùa vàng</p>
          </div>
        </div>

        <div
          class="flex flex-col items-center border-2 border-solid border-white rounded-lg shadow-md overflow-hidden w-64"
        >
          <img
            src="https://mia.vn/media/uploads/blog-du-lich/van-hoa-nhat-ban-1-1685888079.jpg"
            alt=""
            class="w-full h-48 object-cover rounded-lg"
          />
          <div class="text-center mt-2 mb-2">
            <h3 class="font-bold">Nhật Bản</h3>
            <p>Hoa anh đào rực rỡ</p>
          </div>
        </div>

        <div
          class="flex flex-col items-center border-2 border-solid border-white rounded-lg shadow-md overflow-hidden w-64"
        >
          <img
            src="https://ofotravel.com/wp-content/uploads/2018/10/Top-dia-diem-du-lich-phap-nhat-dinh-phai-den-mot-lan-trong-doi-eurocircle-ofotravel.jpg"
            alt=""
            class="w-full h-48 object-cover rounded-lg"
          />
          <div class="text-center mt-2 mb-2">
            <h3 class="font-bold">Pháp</h3>
            <p>Kinh đô ánh sáng</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
