<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực Đơn Của Chúng Tôi</title>
    <link rel="stylesheet" href="css/BTTH3.css" />
  </head>
  <body>
    <section class="menu-container">
      <h2 class="title">Thực Đơn Của Chúng Tôi</h2>

      <div class="menu-grid">
        <div class="food-card">
          <img
            src="https://mtcs.1cdn.vn/2023/05/30/rau-cu-qua.jpg"
            alt="Salad"
          />
          <h3>Salad Rau Củ Tươi</h3>
          <p class="price">45.000 VND</p>
        </div>

        <div class="food-card">
          <img
            src="https://suckhoedoisong.qltns.mediacdn.vn/324455921873985536/2024/12/3/gao-lut-4-17332171762031748507293.jpg"
            alt="Cơm Gạo Lứt"
          />
          <h3>Cơm Gạo Lứt Bổ Dưỡng</h3>
          <p class="price">75.000 VND</p>
        </div>

        <div class="food-card">
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/9/91/Pizza-3007395.jpg"
            alt="Pizza"
          />
          <h3>Pizza Hải Sản Phô Mai</h3>
          <p class="price">120.000 VND</p>
        </div>

        <div class="food-card">
          <img
            src="https://cdn.apartmenttherapy.info/image/upload/f_jpg,q_auto:eco,c_fill,g_auto,w_1500,ar_4:3/tk%2Fphoto%2F2025%2F06-2025%2F2025-06-burger-doneness-guide%2Fburger-doneness-guide-0195"
            alt="Hamburger"
          />
          <h3>Hamburger Bò Úc</h3>
          <p class="price">85.000 VND</p>
        </div>

        <div class="food-card">
          <img
            src="https://static-images.vnncdn.net/files/publish/2022/11/16/thum-mon-ngon-1-300.png?width=0&s=b8LgacChl4E8yxdIBM7mWg"
            alt="Sườn Nướng"
          />
          <h3>Sườn Nướng BBQ</h3>
          <p class="price">150.000 VND</p>
        </div>
      </div>
    </section>
  </body>
</html>
