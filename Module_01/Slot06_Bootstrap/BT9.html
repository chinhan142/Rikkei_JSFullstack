<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      :root {
        --bs-primary: #a61a2e;
        --bs-dark: #212529;
      }

      .btn-register {
        --bs-btn-bg: var(--bs-primary);
        --bs-btn-border-color: var(--bs-dark);
      }

      .btn-details {
        --bs-btn-bg: var(--bs-dark);
        --bs-btn-border-color: var(--bs-dark);
        --bs-btn-color: white;
      }

      .heading {
        color: var(--bs-primary);
      }

      * {
        box-sizing: border-box;
      }

      /* write custom CSS */
      .custom-card {
        border-top: 6px solid var(--bs-primary);
        border-radius: 12px;
        overflow: hidden;
        border-left: 1px solid #ddd;
        border-right: 1px solid #ddd;
        border-bottom: 1px solid #ddd;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5 custom-card">
      <div class="row gx-5">
        <div class="col-5 p-0">
          <img
            src="https://media.istockphoto.com/id/1499670337/photo/diverse-audience-listening-closely-to-lively-panel-discussion-at-tech-conference.jpg?s=612x612&w=0&k=20&c=cdo6F13-BtrPGyVukQ5IfDk-jE1jyyiUTgm9mvAPNgI="
            alt=""
            class="img-fluid"
          />
        </div>

        <div class="col mt-5 ms-3">
          <h3 class="heading fw-bold">Tech Talk: Tương Lai Lập Trình AI</h3>
          <p>
            Tham gia cùng Rikkei Academy để khám phá những xu hướng công nghệ AI
            mới nhất và cách ứng dụng vào phát triển phần mềm trong tương lai.
          </p>
          <p><strong>Thời gian</strong> 09:00 - 12:00, 25/11/2026</p>
          <p><strong>Địa điểm</strong> Cơ sở Rikkei Academy HN</p>

          <div>
            <button class="btn btn-danger btn-register">Đăng ký ngay</button>
            <button class="btn btn-light btn-details">Xem chi tiết</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
