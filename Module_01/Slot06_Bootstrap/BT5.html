<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thêm Sách Mới</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div
        class="card shadow-sm mx-auto"
        style="max-width: 500px; border-radius: 10px"
      >
        <div class="card-body p-4">
          <h3 class="text-center mb-4 fw-normal">Thêm Sách Mới</h3>

          <form>
            <div class="mb-3">
              <label class="form-label fw-bold">Tên sách</label>
              <input
                type="text"
                class="form-control form-control-lg"
                placeholder="Nhập tên sách..."
              />
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Tác giả</label>
              <input
                type="text"
                class="form-control form-control-lg"
                placeholder="Nhập tên tác giả..."
              />
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold">Thể loại</label>
              <select class="form-select form-select-lg text-muted">
                <option selected>Chọn thể loại...</option>
                <option value="1">Văn học</option>
                <option value="2">Kỹ thuật</option>
                <option value="3">Kinh tế</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
              Thêm sách
            </button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
