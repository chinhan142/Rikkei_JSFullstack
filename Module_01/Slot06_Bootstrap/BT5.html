<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      * {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <!-- wrapper -->
    <div class="bg-light py-5 mx-auto" style="max-width: 800px">
      <!-- create container inside -->
      <div class="bg-white rounded mx-auto p-4" style="max-width: 700px">
        <h2 class="text-center">Thêm Sách Mới</h2>
        <form action="" class="w-100">
          <div class="mb-3">
            <label for="book-name" class="form-label fw-bold">Tên sách</label>
            <input
              type="text"
              placeholder="Nhập tên sách..."
              id="book-name"
              class="form-control"
            />
          </div>

          <div class="mb-3">
            <label for="author" class="form-label fw-bold">Tác giả</label>
            <input
              type="text"
              placeholder="Nhập tên tác giả..."
              id="author"
              class="form-control"
            />
          </div>

          <div class="mb-3">
            <label for="category" class="form-label fw-bold">Thể loại</label>
            <select name="category" id="category" class="form-control">
              <option value="">Chọn thể loại</option>
            </select>
          </div>

          <button class="btn btn-primary w-100 mt-3">Thêm sách</button>
        </form>
      </div>
    </div>
  </body>
</html>
